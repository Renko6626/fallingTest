[package]
name = "sand-core"
version.workspace = true
edition.workspace = true

# Ring 0 铁律（program-architecture §2）：本 crate 永不依赖 godot/gdext、网络库、
# 文件系统与墙钟。rayon（有界并行）与 xxhash（状态哈希）为纯计算，属允许清单。
[dependencies]
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[lints]
workspace = true
