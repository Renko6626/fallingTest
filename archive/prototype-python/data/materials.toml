[meta]
version = 1
default_grid_size = [128, 128]

[materials.wall]
cell_type = "solid"
density = 100
color = [128, 128, 128]
tags = ["solid"]

[materials.rock]
cell_type = "solid"
density = 90
color = [100, 100, 100]
color_variance = 8
tags = ["solid"]

[materials.wood]
cell_type = "solid"
density = 80
color = [139, 90, 43]
color_variance = 10
tags = ["solid", "flammable"]

[materials.sand]
cell_type = "powder"
density = 60
color = [194, 178, 128]
color_variance = 15
tags = ["powder"]

[materials.water]
cell_type = "liquid"
density = 10
color = [48, 96, 255]
tags = ["liquid", "water", "conductive"]
dispersion = 5

[materials.oil]
cell_type = "liquid"
density = 8
color = [80, 60, 30]
tags = ["liquid", "flammable"]
dispersion = 2

[materials.lava]
cell_type = "liquid"
density = 30
color = [255, 96, 0]
tags = ["liquid", "lava", "hot"]
dispersion = 1

[materials.steam]
cell_type = "gas"
density = 1
color = [200, 200, 255]
lifetime = 300
tags = ["gas"]
dispersion = 3

[materials.fire]
cell_type = "energy"
density = 0
color = [255, 160, 40]
color_variance = 40
lifetime = 120
tags = ["energy", "hot"]

[[reactions]]
input = ["lava", "water"]
output = ["rock", "steam"]
probability = 0.8

[[reactions]]
input = ["fire", "[flammable]"]
output = ["fire", "fire"]
probability = 0.15

[[reactions]]
input = ["[hot]", "wood"]
output = ["_self", "fire"]
probability = 0.08

[[reactions]]
input = ["[hot]", "water"]
output = ["_self", "steam"]
probability = 0.5
